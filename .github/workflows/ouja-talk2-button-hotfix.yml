name: OUJA talk2 button hotfix

on:
  push:
    paths:
      - ".github/workflows/ouja-talk2-button-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch script.js and style.css
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          sp = Path("script.js")
          s = sp.read_text(encoding="utf-8")
          cp = Path("style.css")
          c = cp.read_text(encoding="utf-8")

          def rep(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"missing expected block: {label}")
              return text.replace(old, new, 1)

          s = rep(s,
              '    button3: { x: 99, y: 0, size: 157 },\n',
              '    button3: { x: 99, y: 0, size: 157 },\n    button4: { x: 336, y: 0, size: 157 },\n',
              'center button4 config')
          s = rep(s,
              '  chaoxiao: "./assets/audio/chaoxiao.mp3?av=123",\n',
              '  chaoxiao: "./assets/audio/chaoxiao.mp3?av=123",\n  talk2: "./assets/audio/talk2.mp3?av=123",\n',
              'talk2 audio config')

          old_dom = '''if (centerActions && !document.querySelector("#centerActionButton3")) {
            const button3 = document.createElement("button");
            button3.className = "center-action-button center-action-button-3";
            button3.id = "centerActionButton3";
            button3.type = "button";
            centerActions.appendChild(button3);
          }
          const centerActionButtons = [...document.querySelectorAll(".center-action-button")];'''
          new_dom = '''if (centerActions && !document.querySelector("#centerActionButton3")) {
            const button3 = document.createElement("button");
            button3.className = "center-action-button center-action-button-3";
            button3.id = "centerActionButton3";
            button3.type = "button";
            centerActions.appendChild(button3);
          }
          if (centerActions && !document.querySelector("#centerActionButton4")) {
            const button4 = document.createElement("button");
            button4.className = "center-action-button center-action-button-4";
            button4.id = "centerActionButton4";
            button4.type = "button";
            centerActions.appendChild(button4);
          }
          const centerActionButtons = [...document.querySelectorAll(".center-action-button")];'''
          s = rep(s, old_dom, new_dom, 'button4 DOM')

          s = rep(s,
              '    { src: "./assets/images/an3.png", label: "播放 chaoxiao 音效" },\n',
              '    { src: "./assets/images/an3.png", label: "播放 chaoxiao 音效" },\n    { src: "./assets/images/an3.png", label: "播放 talk2 音效" },\n',
              'button4 image config')
          s = rep(s,
              'const chaoxiaoAudio = new Audio(AUDIO_CONFIG.chaoxiao);\n',
              'const chaoxiaoAudio = new Audio(AUDIO_CONFIG.chaoxiao);\nconst talk2Audio = new Audio(AUDIO_CONFIG.talk2);\n',
              'talk2 Audio instance')
          s = rep(s,
              'chaoxiaoAudio.preload = "auto";\n',
              'chaoxiaoAudio.preload = "auto";\ntalk2Audio.preload = "auto";\n',
              'talk2 preload')
          s = rep(s,
              '  boxingAudio, jianjiAudio, jianji2Audio, jianji3Audio, chaoxiaoAudio, jiechuAudio,\n',
              '  boxingAudio, jianjiAudio, jianji2Audio, jianji3Audio, chaoxiaoAudio, talk2Audio, jiechuAudio,\n',
              'talk2 load list')
          s = rep(s,
              '  stopAudio(chaoxiaoAudio);\n  stopAudio(jiechuAudio);\n',
              '  stopAudio(chaoxiaoAudio);\n  stopAudio(talk2Audio);\n  stopAudio(jiechuAudio);\n',
              'talk2 reset stop')

          # 用单行锚点插入 button4 布局变量，避免缩进差异。
          anchor = '  scene.style.setProperty("--center-button-3-size", `${centerButtons.button3.size * scale}px`);\n'
          addition = anchor + '  scene.style.setProperty("--center-button-4-x", `${centerButtons.button4.x * scale}px`);\n  scene.style.setProperty("--center-button-4-y", `${centerButtons.button4.y * scale}px`);\n  scene.style.setProperty("--center-button-4-size", `${centerButtons.button4.size * scale}px`);\n'
          if '--center-button-4-size' not in s:
              if anchor not in s:
                  raise SystemExit('missing button3 layout anchor')
              s = s.replace(anchor, addition, 1)

          old_event = '''centerActionButtons[2]?.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            playAudio(chaoxiaoAudio).catch((error) => {
              console.warn("chaoxiao 音效播放失败：", error);
            });
          });'''
          new_event = '''centerActionButtons[2]?.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            playAudio(chaoxiaoAudio).catch((error) => {
              console.warn("chaoxiao 音效播放失败：", error);
            });
          });
          centerActionButtons[3]?.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            playAudio(talk2Audio).catch((error) => {
              console.warn("talk2 音效播放失败：", error);
            });
          });'''
          s = rep(s, old_event, new_event, 'talk2 button click')

          css_anchor = '''.center-action-button-3 {
            left: var(--center-button-3-x);
            top: var(--center-button-3-y);
            width: var(--center-button-3-size);
            height: var(--center-button-3-size);
          }
          '''
          css_add = css_anchor + '''
          .center-action-button-4 {
            left: var(--center-button-4-x);
            top: var(--center-button-4-y);
            width: var(--center-button-4-size);
            height: var(--center-button-4-size);
          }
          '''
          if '.center-action-button-4 {' not in c:
              if css_anchor not in c:
                  raise SystemExit('missing button3 CSS anchor')
              c = c.replace(css_anchor, css_add, 1)

          must = [
              'button4: { x: 336, y: 0, size: 157 }',
              'talk2: "./assets/audio/talk2.mp3?av=123"',
              'centerActionButton4',
              '{ src: "./assets/images/an3.png", label: "播放 talk2 音效" }',
              'playAudio(talk2Audio)',
              'playAudio(jianji3Audio)',
              'playAudio(jianji2Audio)',
              '12: "./assets/audio/sdjianglin.mp3?av=123"',
          ]
          for needle in must:
              if needle not in s:
                  raise SystemExit(f"regression check failed: {needle}")
          if '.center-action-button-4 {' not in c:
              raise SystemExit('button4 CSS missing')

          sp.write_text(s, encoding="utf-8")
          cp.write_text(c, encoding="utf-8")
          PY

          node --check script.js

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js style.css
          if git diff --cached --quiet; then
            echo "No change needed."
            exit 0
          fi
          git commit -m "Add talk2 button beside an3"
          git push

# trigger retry 2026-08-26
