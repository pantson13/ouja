name: OUJA an5 bgm hotfix

on:
  push:
    paths:
      - ".github/workflows/ouja-an5-bgm-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch script.js
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("script.js")
          s = p.read_text(encoding="utf-8")

          def rep(old, new, label):
              global s
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f"missing expected block: {label}")
              s = s.replace(old, new, 1)

          # an5：短按 bgm1，长按 1 秒 bgm2。
          rep(
              '  guo: "./assets/audio/guo.mp3?av=123",\n',
              '  guo: "./assets/audio/guo.mp3?av=123",\n  bgm1: "./assets/audio/bgm1.mp3?av=123",\n  bgm2: "./assets/audio/bgm2.mp3?av=123",\n',
              'bgm audio config',
          )
          rep(
              'const guoAudio = new Audio(AUDIO_CONFIG.guo);\n',
              'const guoAudio = new Audio(AUDIO_CONFIG.guo);\nconst bgm1Audio = new Audio(AUDIO_CONFIG.bgm1);\nconst bgm2Audio = new Audio(AUDIO_CONFIG.bgm2);\n',
              'bgm audio instances',
          )
          rep(
              'guoAudio.preload = "auto";\n',
              'guoAudio.preload = "auto";\nbgm1Audio.preload = "auto";\nbgm2Audio.preload = "auto";\n',
              'bgm preload',
          )
          rep(
              '  huagai1Audio, huagai2Audio, guoAudio, huhuanAudio, jingshijieAudio, timeoutAudio,\n',
              '  huagai1Audio, huagai2Audio, guoAudio, bgm1Audio, bgm2Audio, huhuanAudio, jingshijieAudio, timeoutAudio,\n',
              'bgm load list',
          )
          rep(
              '  stopAudio(guoAudio);\n  stopAudio(huhuanAudio);\n',
              '  stopAudio(guoAudio);\n  stopAudio(bgm1Audio);\n  stopAudio(bgm2Audio);\n  stopAudio(huhuanAudio);\n',
              'bgm reset stop',
          )

          s = s.replace(
              '{ src: "./assets/images/an5.png", label: "播放 guo 音效" },',
              '{ src: "./assets/images/an5.png", label: "短按播放 bgm1，长按播放 bgm2" },',
              1,
          )

          old_event = '''sideButtons[0]?.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();
            playAudio(guoAudio).catch((error) => {
              console.warn("guo 音效播放失败：", error);
            });
          });'''

          new_event = '''// 第二排第一颗圆形按钮 an5：
          // 短按播放 bgm1；持续按住满 1 秒播放 bgm2，并抑制松手后的短按 click。
          const BGM2_LONG_PRESS_MS = 1000;
          const BGM2_MOVE_CANCEL_PX = 12;
          let bgm2LongPressTimer = 0;
          let bgm2PressPointerId = null;
          let bgm2PressStart = null;
          let bgm2LongPressTriggered = false;
          let suppressNextBgm1Click = false;

          function clearBgm2LongPressTimer() {
            clearTimeout(bgm2LongPressTimer);
            bgm2LongPressTimer = 0;
          }

          sideButtons[0]?.addEventListener("pointerdown", (event) => {
            if (event.pointerType === "mouse" && event.button !== 0) return;

            clearBgm2LongPressTimer();
            bgm2PressPointerId = event.pointerId;
            bgm2PressStart = { x: event.clientX, y: event.clientY };
            bgm2LongPressTriggered = false;

            // iPhone / PWA：在真实用户手势里先静音解锁 bgm2，
            // 这样 1 秒定时器到点后仍能稳定播放。
            primeAudio(bgm2Audio, () => false).catch(() => undefined);
            sideButtons[0]?.setPointerCapture?.(event.pointerId);

            bgm2LongPressTimer = window.setTimeout(() => {
              if (bgm2PressPointerId !== event.pointerId) return;

              bgm2LongPressTriggered = true;
              suppressNextBgm1Click = true;
              bgm2Audio.muted = false;

              playAudio(bgm2Audio).catch((error) => {
                console.warn("bgm2 长按音效播放失败：", error);
              });
            }, BGM2_LONG_PRESS_MS);
          });

          sideButtons[0]?.addEventListener("pointermove", (event) => {
            if (
              event.pointerId !== bgm2PressPointerId ||
              !bgm2PressStart ||
              bgm2LongPressTriggered
            ) return;

            const dx = event.clientX - bgm2PressStart.x;
            const dy = event.clientY - bgm2PressStart.y;
            if (Math.hypot(dx, dy) > BGM2_MOVE_CANCEL_PX) {
              clearBgm2LongPressTimer();
            }
          });

          sideButtons[0]?.addEventListener("pointerup", (event) => {
            if (event.pointerId !== bgm2PressPointerId) return;
            clearBgm2LongPressTimer();
            bgm2PressPointerId = null;
            bgm2PressStart = null;
          });

          sideButtons[0]?.addEventListener("pointercancel", (event) => {
            if (event.pointerId !== bgm2PressPointerId) return;
            clearBgm2LongPressTimer();
            bgm2PressPointerId = null;
            bgm2PressStart = null;
            bgm2LongPressTriggered = false;
          });

          sideButtons[0]?.addEventListener("contextmenu", (event) => {
            event.preventDefault();
          });

          sideButtons[0]?.addEventListener("click", (event) => {
            event.preventDefault();
            event.stopPropagation();

            if (suppressNextBgm1Click) {
              suppressNextBgm1Click = false;
              bgm2LongPressTriggered = false;
              return;
            }

            playAudio(bgm1Audio).catch((error) => {
              console.warn("bgm1 音效播放失败：", error);
            });
          });'''

          rep(old_event, new_event, 'an5 bgm interaction')

          # 回归检查：an1/an2/an3/an4 和其它第二排按钮不能丢。
          must = [
              'bgm1: "./assets/audio/bgm1.mp3?av=123"',
              'bgm2: "./assets/audio/bgm2.mp3?av=123"',
              'playAudio(bgm1Audio)',
              'playAudio(bgm2Audio)',
              'const BGM2_LONG_PRESS_MS = 1000;',
              'playAudio(boxing1Audio)',
              'playAudio(boxing2Audio)',
              'playAudio(jianji3Audio)',
              'playAudio(jianji2Audio)',
              'playAudio(chaoxiaoAudio)',
              'playAudio(talk2Audio)',
              'playAudio(huhuanAudio)',
              'playAudio(jingshijieAudio)',
              'playAudio(timeoutAudio)',
              '12: "./assets/audio/sdjianglin.mp3?av=123"',
          ]
          for needle in must:
              if needle not in s:
                  raise SystemExit(f"regression check failed: {needle}")

          # an5 不再触发 guo。
          an5_start = s.find('// 第二排第一颗圆形按钮 an5：')
          an6_start = s.find('sideButtons[1]?.addEventListener', an5_start)
          if an5_start < 0 or an6_start < 0:
              raise SystemExit('cannot isolate an5 interaction block')
          if 'playAudio(guoAudio)' in s[an5_start:an6_start]:
              raise SystemExit('old guo trigger still exists in an5')

          p.write_text(s, encoding="utf-8")
          PY

          node --check script.js

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          if git diff --cached --quiet; then
            echo "No change needed."
            exit 0
          fi
          git commit -m "Set an5 short bgm1 long bgm2"
          git push
