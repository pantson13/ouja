  </head>
  <body>
    <svg class="effect-definitions" aria-hidden="true" width="0" height="0">
      <filter id="waterRipple" x="-35%" y="-50%" width="170%" height="200%" color-interpolation-filters="sRGB">
        <feTurbulence
          id="waterNoise"
          type="fractalNoise"
          baseFrequency="0.009 0.028"
          numOctaves="1"
          seed="7"
          result="noise"
        />
        <feDisplacementMap
          id="waterDisplacement"
          in="SourceGraphic"
          in2="noise"
          scale="0"
          xChannelSelector="R"
          yChannelSelector="B"
        />
      </filter>
      <filter id="innerEnergyEdge" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="erode" radius="24" result="innerAlpha" />
        <feComposite in="SourceAlpha" in2="innerAlpha" operator="out" result="innerEdge" />
        <feGaussianBlur in="innerEdge" stdDeviation="13" result="softInnerEdge" />
        <feComposite in="softInnerEdge" in2="SourceAlpha" operator="in" result="clippedInnerGlow" />
        <feComposite in="SourceGraphic" in2="clippedInnerGlow" operator="in" />
      </filter>
    </svg>

    <main class="scene" id="scene" aria-label="OUJA 腰带动画">
      <div class="scene-backgrounds" aria-hidden="true">
        <img class="scene-background scene-background-start" src="./assets/images/bg2.png" alt="" />
        <img class="scene-background scene-background-final" src="./assets/images/bg.png" alt="" />
      </div>

      <div class="character-stage character-stage-back" aria-hidden="true">
        <div class="character-merge character-merge-center">
          <img class="character-merge-image" src="./assets/images/bg4.png" alt="" />
        </div>
        <div class="character-flash">
          <img class="character-image character-flash-image" src="./assets/images/bg5.png" alt="" />
        </div>
        <div class="character-reveal">
          <img class="character-image" src="./assets/images/bg3.png" alt="" />
        </div>
      </div>

      <div class="belt-position">
        <div class="belt" id="belt">
          <span class="belt-effect" id="beltEffect">
            <span class="belt-art" id="beltArt">
              <img class="belt-base" src="./assets/images/ydbg.png" alt="" />

              <button class="card-unit card-box" id="cardBox" type="button" aria-label="卡盒插入腰带">
                <img class="card-layer card-bottom" src="./assets/images/khdc.png" alt="" />
                <img class="card-layer card-middle" id="kpcLayer" src="./assets/images/kpc.png" alt="" />
                <img class="card-layer card-glow" src="./assets/images/khfg.png" alt="" />
                <img class="card-layer card-cover" src="./assets/images/khzd.png" alt="" />
              </button>

              <img class="belt-layer belt-layer-up" src="./assets/images/ydup.png" alt="" />
              <img class="belt-layer belt-layer-down" src="./assets/images/yddown.png" alt="" />
              <img class="belt-glow" src="./assets/images/ydfg.png" alt="" />
            </span>
          </span>
        </div>
      </div>

      <div class="character-stage character-stage-front" aria-hidden="true">
        <div class="character-merge character-merge-left">
          <img class="character-merge-image" src="./assets/images/bg4.png" alt="" />
        </div>
        <div class="character-merge character-merge-front">
          <img class="character-merge-image" src="./assets/images/bg4.png" alt="" />
        </div>
        <div class="character-merge character-merge-right">
          <img class="character-merge-image" src="./assets/images/bg4.png" alt="" />
        </div>
      </div>

      <canvas class="shatter-canvas" id="shatterCanvas" aria-hidden="true"></canvas>

      <div class="ws-panel" id="wsPanel" aria-label="WS 卡片选择">
        <button class="ws-card" id="ws1" type="button" data-ws="1" aria-label="选择 WS1"><img src="./assets/images/ws1.png" alt="" /></button>
        <button class="ws-card" id="ws2" type="button" data-ws="2" aria-label="选择 WS2"><img src="./assets/images/ws2.png" alt="" /></button>
        <button class="ws-card" id="ws3" type="button" data-ws="3" aria-label="选择 WS3"><img src="./assets/images/ws3.png" alt="" /></button>
        <button class="ws-card" id="ws4" type="button" data-ws="4" aria-label="选择 WS4"><img src="./assets/images/ws4.png" alt="" /></button>
        <button class="ws-card" id="ws5" type="button" data-ws="5" aria-label="选择 WS5"><img src="./assets/images/ws5.png" alt="" /></button>
        <button class="ws-card" id="ws6" type="button" data-ws="6" aria-label="选择 WS6"><img src="./assets/images/ws6.png" alt="" /></button>
        <button class="ws-card" id="ws7" type="button" data-ws="7" aria-label="选择 WS7"><img src="./assets/images/ws7.png" alt="" /></button>
        <button class="ws-card" id="ws8" type="button" data-ws="8" aria-label="选择 WS8"><img src="./assets/images/ws8.png" alt="" /></button>
        <button class="ws-card" id="ws9" type="button" data-ws="9" aria-label="选择 WS9"><img src="./assets/images/ws9.png" alt="" /></button>
        <button class="ws-card" id="ws10" type="button" data-ws="10" aria-label="选择 WS10"><img src="./assets/images/ws10.png" alt="" /></button>
        <button class="ws-card" id="ws11" type="button" data-ws="11" aria-label="选择 WS11"><img src="./assets/images/ws11.png" alt="" /></button>
        <button class="ws-card" id="ws12" type="button" data-ws="12" aria-label="选择 WS12"><img src="./assets/images/ws12.png" alt="" /></button>
      </div>

      <div class="side-controls" id="sideControls" aria-label="左下角快捷按钮">

      <!-- bg4 完整结束后出现。后续可直接在按钮内部加入图标图片。 -->
      <div class="center-actions" id="centerActions" aria-label="中间动作按钮">
        <button class="center-action-button center-action-button-1" id="centerActionButton1" type="button" aria-label="播放 boxing 音效"></button>
        <button class="center-action-button center-action-button-2" id="centerActionButton2" type="button" aria-label="播放 jianji 音效"></button>
      </div>

      <div class="aux-dock" id="auxDock" aria-label="右侧蛇杖">
        <!-- 蛇杖四层，从下到上：sz2 / 卡槽区域 / sz1 / syfg。 -->
        <img class="sz2-image" id="sz2Image" src="./assets/images/sz2.png" alt="" />
        <div class="sz-card-slot-debug" id="szCardSlotDebug" aria-hidden="true"></div>
        <div class="sz-card-slot-mask" id="szCardSlotMask" aria-hidden="true">
          <img class="sz-inserted-card" id="szInsertedCard" src="./assets/images/kpc.png" alt="" />
        </div>
        <img class="sz1-image" id="sz1Image" src="./assets/images/sz1.png" alt="" />
        <img class="aux-card-cover-mask" id="auxCardCoverMask" src="./assets/images/khzd.png" alt="" aria-hidden="true" />
        <img class="aux-syfg" id="syfgImage" src="./assets/images/syfg.png" alt="" aria-hidden="true" />
        <button class="sz1-button" id="sz1Button" type="button" aria-label="弹出蛇杖卡槽"></button>
        <button class="sz2-button" id="sz2Button" type="button" aria-label="确认蛇杖读卡"></button>
        <button class="bs-button" id="bsButton" type="button" aria-label="打开蛇杖"><img src="./assets/images/bs.png" alt="" /></button>
      </div>

      <!-- PWA：独立全屏拖卡层。正面卡从抽出到插入蛇杖前始终只在这个固定容器内活动。 -->
      <div class="card-drag-layer" id="cardDragLayer" aria-hidden="true">
        <div class="aux-card-hit-debug" id="auxCardHitDebug" aria-hidden="true"></div>
        <div class="aux-transfer-card" id="auxTransferCard" aria-hidden="true"><img class="aux-transfer-card-image" id="auxTransferCardImage" src="./assets/images/kpc.png" alt="" /></div>
      </div>

      <button class="card-unit card-trigger" id="cardTrigger" type="button" aria-label="启动卡盒与腰带动画">
        <img class="card-layer card-bottom" src="./assets/images/khdc.png" alt="" />
        <img class="card-layer card-middle" src="./assets/images/kpc.png" alt="" />
        <img class="card-layer card-glow" src="./assets/images/khfg.png" alt="" />
        <img class="card-layer card-cover" src="./assets/images/khzd.png" alt="" />
      </button>

    </main>
